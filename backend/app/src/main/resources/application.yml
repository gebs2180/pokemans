# Defaults point at the local docker-compose services; production overrides everything via environment variables.
spring:
  application:
    name: pokemans
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemans}
    username: ${DB_USERNAME:pokemans}
    password: ${DB_PASSWORD:pokemans}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema (src/main/resources/db/migration)
    properties:
      # Batch inserts (a refresh writes 11 snapshot rows per card and grader). Ids are assigned
      # UUIDs, so nothing stops batching; append-only entities implement Persistable to skip merge.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  mvc:
    problemdetails:
      enabled: true
  # OIDC: set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI (e.g. https://<tenant>.us.auth0.com/)
  # and SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES (the API identifier) in the environment.
  # Without an issuer the API rejects every bearer token.

pokemans:
  security:
    # Custom claim the provider adds to access tokens with the user's roles. Only ADMIN is read from it;
    # PARTNER and COLLECTOR come from org membership in the database.
    roles-claim: https://pokemans.app/roles
    # Custom claim set to true by the provider's post-login Action when the login used MFA.
    mfa-claim: https://pokemans.app/mfa
    # ADMIN requires an MFA login (amr contains "mfa", or the MFA claim is true).
    require-admin-mfa: true
  invites:
    ttl: 7d
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:pokemans}
    secret-key: ${STORAGE_SECRET_KEY:pokemans-local}
    path-style: true
    photo-bucket: ${STORAGE_PHOTO_BUCKET:photos}
    upload-url-ttl: 10m
    max-upload-bytes: 26214400
    # Local dev: create the versioned photo bucket on startup. Turn off in production.
    auto-create-buckets: ${STORAGE_AUTO_CREATE_BUCKETS:true}
  quality:
    min-short-side-px: 1200
    min-long-side-px: 1600
    min-blur-score: 100 # whole frame; only used when no card is found
    max-glare-fraction: 0.03
    # Card in frame (calibrated on first real photos, 2026-10-16: a sharp card crop scored ~370,
    # the same photo with a slight blur 75, a clearly soft one 17).
    max-card-aspect-error: 0.05
    min-card-margin-fraction: 0.06
    min-card-coverage: 0.25
    min-card-blur-score: 50
  catalog:
    tcgdex:
      # Free, no key; card data MIT-licensed. Off = manual entry only.
      enabled: ${CATALOG_TCGDEX_ENABLED:true}
      base-url: https://api.tcgdex.net/v2
    # Automatic recognition: Claude reads name and number off the front crop and suggests catalog
    # matches. Key in the environment only. Front crops are sent to Anthropic's API.
    reader:
      enabled: ${CARD_READER_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CARD_READER_MODEL:claude-sonnet-5-5}
  condition:
    worker:
      poll-interval: 15s
    # Pre-grading providers stay off until their terms are confirmed in writing
    # (docs/pregrade-providers.md) and a key is set in the environment, never in this file.
    ximilar:
      enabled: ${XIMILAR_ENABLED:false}
      api-key: ${XIMILAR_API_KEY:}
    cardgrade:
      # Opt the CardGrade account out of AI training in its Settings before enabling.
      enabled: ${CARDGRADE_ENABLED:false}
      api-key: ${CARDGRADE_API_KEY:}
  pricing:
    # Valuation parameter set the snapshots are priced with (windows, half-life, trimming, confidence).
    parameter-set: 1.0.0
    # Each grading company's comps price that company's grades separately; there is no bulk floor.
    currency: USD
    # Starting value, to be set from real data: how many cards an era step-down ratio needs.
    min-cards-per-ratio: 3
    ingestion:
      # Nightly comp ingestion and snapshot refresh. Off: no price source is licensed yet
      # (docs/price-data-sources.md). Vendor keys go in the environment, never in this file.
      enabled: ${PRICING_INGESTION_ENABLED:false}
      cron: "0 30 6 * * *"
      lookback: 400d
  offers:
    # Instant offers (Zach, 2026-10-19): one firm price, the expected value over the card's grades of the
    # quick-sale value less the buyer's margin, which the parameter set sets by confidence (1.2.0: A 10%,
    # B 13%, C 17%). An offer stands for a week; a posted offer waits two weeks.
    offer-valid-for: 7d
    listing-open-for: 14d
    # No offer above this firm price: EasyPost's $5,000 insurance limit, so every label is insured for
    # the full price. The $500 beta maximum was lifted on 2026-10-26 (Zach); set this lower to cap again.
    max-price: 5000
  shipping:
    # Prepaid, insured labels for taken cards, bought on our account and billed to buyers monthly
    # (Zach, 2026-10-19). Off until a key is set in the environment; a test key buys test labels.
    easypost:
      enabled: ${EASYPOST_ENABLED:false}
      api-key: ${EASYPOST_API_KEY:}
      carrier: USPS
    # A single raw card in a toploader, in a bubble mailer: inches and ounces.
    parcel:
      length: 7
      width: 5
      height: 1
      weight-oz: 3
  collateral:
    # Lender and insurer collateral reports (valuation runs and report PDFs). Paused while Zach's outside
    # interest is cleared with his employer (2026-10-19): the APIs aren't registered unless this is on.
    enabled: ${COLLATERAL_ENABLED:false}
  valuation:
    # Valuations and offers use 1.2.0: 1.1.0 (1.0.0 plus the fallback sigma) plus the offer margin by confidence.
    parameter-set: 1.2.0
    # Raw cards are valued on PSA's table only, with no fallback to another grader (Zach, 2026-10-18).
    grading-company: PSA
    # Starting values per card (Zach, 2026-10-18); the admin can override them on each run.
    grading-cost:
      fee: 25
      shipping: 5
      insurance: 2
      time-to-cash-rate: 0.02
  provenance:
    # A custody check (vault statement, in-person visit, ...) counts this long, then lapses and the
    # card gets no advance until it is checked again.
    custody-check-valid-for: 90d

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Error reports. Off unless SENTRY_DSN is set (docs/hosting.md). ERROR log lines and unhandled exceptions are sent;
# request bodies, headers, cookies and user IPs are not.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  max-request-body-size: none
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

---
# Production (docs/hosting.md): SPRING_PROFILES_ACTIVE=prod. Nothing here has a local default, so the app
# refuses to start with a variable missing instead of quietly using the docker-compose credentials.
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI,
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES, STORAGE_ENDPOINT, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY,
# STORAGE_PHOTO_BUCKET. Optional: STORAGE_PUBLIC_ENDPOINT, STORAGE_REGION (default auto), SENTRY_DSN,
# SENTRY_ENVIRONMENT, and the feature switches above (CARD_READER_ENABLED, EASYPOST_ENABLED, ...).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          audiences: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES}

server:
  # Behind Caddy, which terminates HTTPS and sets X-Forwarded-*.
  forward-headers-strategy: framework
  shutdown: graceful

pokemans:
  storage:
    # Cloudflare R2: region "auto", path-style, and no aws-chunked uploads (R2 answers them with 403).
    # R2 has no bucket versioning; the nightly backup copy (deploy/backup) stands in for it.
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:auto}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    photo-bucket: ${STORAGE_PHOTO_BUCKET}
    auto-create-buckets: false
    chunked-encoding: false

management:
  endpoint:
    health:
      show-details: never
