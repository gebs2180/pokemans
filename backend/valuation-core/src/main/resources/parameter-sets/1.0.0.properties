# Valuation parameter set 1.0.0: starting values from the Raw Collection Valuation Methodology (2026-10-15).
# Parameter sets are immutable once a valuation run references them: change values in a new version file.
version=1.0.0

# Step 3: pricing
pricing.halfLifeDays=30
pricing.windowDays=90
pricing.extendedWindowDays=180
pricing.minSalesInWindow=2
pricing.outlierTrimMinSales=10
# Share of sales trimmed from each end when outlier trimming applies.
pricing.outlierTrimFraction=0.10

# Liquidity tiers by sales per month: high is above highAbove, low is below lowBelow, mid otherwise.
liquidity.highAbove=20
liquidity.lowBelow=5

# Step 4: values
values.sellingFees=0.15
values.buyerCosts=0.12
values.searchPremium.high=0.00
values.searchPremium.mid=0.05
values.searchPremium.low=0.10
values.speedDiscount.high=0.05
values.speedDiscount.mid=0.10
values.speedDiscount.low=0.20
values.stressK=2
values.stressMonths=2
values.stressShiftGrades=2
values.stressShiftGradesConfidenceC=3
values.depthDiscountFloor=0.10
values.depthDiscountCap=0.50

# Confidence from comps: probability-weighted count of observed sales behind the grade prices.
# Base confidence is the worse of this and photo confidence; any derived price in play drops one level.
confidence.compsForA=10
confidence.compsForB=5
confidence.compsForC=2

# Step 5: portfolio
portfolio.minFmv=25
portfolio.singleCardCap=0.20
portfolio.topFiveCap=0.50
portfolio.correlationThreshold=0.40
portfolio.correlationHaircut=0.10
portfolio.suggestedAlphaLow=0.50
portfolio.suggestedAlphaHigh=0.70

# Step 6: grade-first list
gradeFirst.minLift=1.0
gradeFirst.topN=20
