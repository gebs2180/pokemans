# Valuation parameter set 1.5.0: 1.4.0 plus guards on PokeTrace day averages and a ceiling on measured sigma
# (2026-11-09 deep review, B4). Every other value is 1.4.0's.
# 1.4.0 was 1.3.0 plus two limits on the PSA 10 premium (Zach, 2026-11-09).
# 1.3.0 was 1.2.0 plus two comps-confidence rules from the 2026-11-09 deep review (B5).
# 1.2.0 was 1.1.0 plus the instant-offer buyer margin by confidence (Zach, 2026-10-21); 1.1.0 was 1.0.0 plus
# the fallback sigma valuation runs need (Zach, 2026-10-18), and concentration caps measured against the
# eligible FLV at every size, with no minimum card count (2026-10-19).
# Parameter sets are immutable once a valuation run references them: change values in a new version file.
version=1.5.0

# Step 3: pricing
pricing.halfLifeDays=30
pricing.windowDays=90
pricing.extendedWindowDays=180
pricing.minSalesInWindow=2
pricing.outlierTrimMinSales=10
# Share of sales trimmed from each end when outlier trimming applies.
pricing.outlierTrimFraction=0.10
# Below the lowest sold grade, with no era step-down ratio yet, step down with the card's own ladder:
# its steepest per-grade ratio, if it has sales in at least minGrades grades spanning minSpan grades.
pricing.cardLadder.minGrades=2
pricing.cardLadder.minSpan=2
# A PSA 10 is its own market, like a PSA 1: the step up to grade 10 is left out of the card's own steepest ratio,
# so a steep 10 premium can't drag the lower grades down. Grade 10 still counts towards minGrades and minSpan
# (Zach, 2026-11-09).
pricing.cardLadder.excludeTen=true
# A price table the latest refresh couldn't replace (sales aged out, or purged) is still used, but its
# confidence drops one level once it is more than graceDays old, and one more every daysPerLevel after.
pricing.stale.graceDays=7
pricing.stale.daysPerLevel=30
# A grade with fewer than minSalesInWindow sale days even in the extended window is thin: its observed price is
# still used, but for confidence it counts as derived, not observed. It drops its own confidence one level,
# drops the card's one level where it carries probability, and is left out of the weighted count (review B5).
pricing.thinGradesDerived=true
# PokeTrace gives one row per card, tier, source and day, and a day with a sale is one comp at the day's average.
# A day is left out of pricing (never shifted) when it can't be trusted as one comp (review B4):
# - its average lies outside its own low-high range, or its low isn't positive;
# - its high is more than maxSpread times its low: one wild sale is blurred into the average;
# - its average is more than maxMultipleOfTier times the median of the tier's other sale days (all sources) within
#   neighbourhoodDays either side, when there are at least minOtherDays of them.
# Only high days are left out by the last rule: dropping a low day would push the price up. Every exclusion is
# stored with its reason. (Defaults to confirm.)
pricing.pokeTraceDay.maxSpread=3
pricing.pokeTraceDay.maxMultipleOfTier=3
pricing.pokeTraceDay.minOtherDays=2
pricing.pokeTraceDay.neighbourhoodDays=90

# Liquidity tiers by sales per month: high is above highAbove, low is below lowBelow, mid otherwise.
liquidity.highAbove=20
liquidity.lowBelow=5

# Step 4: values
values.sellingFees=0.15
values.buyerCosts=0.12
values.searchPremium.high=0.00
values.searchPremium.mid=0.05
values.searchPremium.low=0.10
values.speedDiscount.high=0.05
values.speedDiscount.mid=0.10
values.speedDiscount.low=0.20
values.stressK=2
values.stressMonths=2
values.stressShiftGrades=2
values.stressShiftGradesConfidenceC=3
values.depthDiscountFloor=0.10
values.depthDiscountCap=0.50
# Monthly sigma for a card whose price stats have too few 30-day changes to measure one. Deliberately high
# (shock 1 - 2 x 0.20 x sqrt 2 = 0.43), and the card's confidence drops one level as well.
values.fallbackSigma=0.20
# A measured monthly sigma above this is a data problem, not a market: the valuation uses the fallback sigma and drops
# confidence one level instead (review B4; Base Charizard measured 20.48 from a few wild PSA 10 days).
values.maxSigma=1.0

# Confidence from comps: probability-weighted count of observed sales behind the grade prices.
# Base confidence is the worse of this and photo confidence; any derived price in play drops one level.
confidence.compsForA=10
confidence.compsForB=5
confidence.compsForC=2
# Comps confidence is also no better than the sales behind the modal grade's price (for a derived grade, the
# thinnest grade it came from), so a deep neighbour can't hide a thin price where the card most likely grades
# (review B5).
confidence.modalGrade=true

# Step 5: portfolio
portfolio.minFmv=25
portfolio.singleCardCap=0.20
portfolio.topFiveCap=0.50
# Both caps are measured against the eligible FLV before caps, at every collection size (Zach, 2026-10-19).
portfolio.correlationThreshold=0.40
portfolio.correlationHaircut=0.10
portfolio.suggestedAlphaLow=0.50
portfolio.suggestedAlphaHigh=0.70

# Step 6: grade-first list
gradeFirst.minLift=1.0
gradeFirst.topN=20

# Step 8: instant offers. The buyer's margin m by the card's confidence: a less certain condition leaves
# the buyer more room for the risk they carry under a firm price. Confidence D gets no offer.
offers.buyerMargin.A=0.10
offers.buyerMargin.B=0.13
offers.buyerMargin.C=0.17
# An offer's 10 rung pays at most this multiple of its 9 rung, both after net price, the cap at the grade above,
# f, d and m: a clean card keeps a premium, a bounded one (Zach, 2026-11-09; 2.5 to be confirmed). Offers only:
# FMV, RV, QSV, FLV and the grade-first list keep the full ladder. A 9 rung of zero leaves the 10 alone.
offers.maxTenToNineMultiple=2.5
