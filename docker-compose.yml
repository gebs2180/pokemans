# Local development dependencies. Credentials here are local-only defaults; never reuse them elsewhere.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pokemans
      POSTGRES_USER: pokemans
      POSTGRES_PASSWORD: pokemans
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemans -d pokemans"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pokemans
      MINIO_ROOT_PASSWORD: pokemans-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Creates the private photo and report buckets with versioning on, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 pokemans pokemans-local; do sleep 1; done;
      mc mb --ignore-existing local/photos local/reports;
      mc version enable local/photos;
      mc version enable local/reports;
      "

volumes:
  postgres-data:
  minio-data:
