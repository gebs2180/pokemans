# Local development dependencies. Credentials here are local-only defaults; never reuse them elsewhere.
# Ports bind to loopback only, so the default credentials aren't reachable from the network.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pokemans
      POSTGRES_USER: pokemans
      POSTGRES_PASSWORD: pokemans
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemans -d pokemans"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO stopped publishing images to Docker Hub in 2025; Chainguard's free build is a drop-in
  # (only :latest is free). The backend creates the versioned photo bucket on startup.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pokemans
      MINIO_ROOT_PASSWORD: pokemans-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
